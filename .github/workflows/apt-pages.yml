name: Publish APT Repository

on:
  workflow_run:
    workflows: [Publish Release]
    types: [completed]
  workflow_dispatch:
  schedule:
    # Keep the 30-day metadata validity window fresh even between releases.
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: apt-pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.repository == 'thewildhive/go-motd' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out trusted publishing code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Install repository tools
        run: sudo apt-get update && sudo apt-get install -y apt-utils dpkg-dev gnupg
      - name: Download and verify all stable Debian releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/collect-apt-packages.sh "$RUNNER_TEMP/apt-packages"
      - name: Build and sign repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_FINGERPRINT: ${{ vars.APT_SIGNING_FINGERPRINT }}
        shell: bash
        run: |
          [[ -n "$APT_SIGNING_KEY" && "$APT_SIGNING_FINGERPRINT" =~ ^[A-F0-9]{40}$ ]]
          export GNUPGHOME
          GNUPGHOME="$(mktemp -d)"
          trap 'gpgconf --kill gpg-agent; rm -rf "$GNUPGHOME"' EXIT
          printf '%s' "$APT_SIGNING_KEY" | gpg --batch --import
          unset APT_SIGNING_KEY
          bash .github/scripts/build-apt-repo.sh "$RUNNER_TEMP/apt-packages" "$RUNNER_TEMP/apt-site"
      - name: Upload complete repository snapshot
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/apt-site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy signed repository to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
